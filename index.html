let exitPrompt=false, localTest=false;
const audioEvents=[];
const releaseNotes=[

 {version:'v1.1.3', notes:'加入在线好友房、准备状态和自动联机对战，保留本机双人。'},
 {version:'v1.0.3', notes:'每波小怪数量从 4 只增加到 6 只。'},

const soundCues={

 waterUrgent:[['noise',1400,.46,.18,590],['sawtooth',180,.19,.17,110],['square',570,.11,.11,370,.12]],

};
let audio=null, master=null, noise=null, muted=false, nextWaterCue=155, resuming=false;
const pendingSounds=[];
function unlockAudio(){
 const Audio=globalThis.AudioContext||globalThis.webkitAudioContext||globalThis.window?.AudioContext;
 if(!Audio)return;
 try{
  if(!audio){
   audio=new Audio();
   master=audio.createGain();master.gain.value=muted?0:.68;master.connect(audio.destination);
   noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.75),audio.sampleRate);
   const data=noise.getChannelData(0);
   for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  }
  if(audio.state!=='running'&&!resuming){
   resuming=true;
   Promise.resolve(audio.resume()).then(()=>{
    if(audio.state==='running')for(const cue of pendingSounds.splice(0))sound(...cue);
   }).catch(()=>{}).finally(()=>{resuming=false});
  }
 }catch{audio=null;resuming=false;}
}
function sound(name,delay=0){
 if(globalThis.authoritative){audioEvents.push([name,delay]);return;}
 if(!audio||muted)return;
 if(audio.state!=='running'){
  if(name==='click'||name==='go'||name==='tick'){
   if(pendingSounds.length>=4)pendingSounds.shift();
   pendingSounds.push([name,delay]);
  }
  return;
 }
 for(const [shape,from,length,volume,to=from,offset=0] of soundCues[name]){
  const t=audio.currentTime+delay+offset;
  const gain=audio.createGain();gain.connect(master);
  gain.gain.setValueAtTime(.001,t);
  gain.gain.linearRampToValueAtTime(volume,t+.008);
  gain.gain.exponentialRampToValueAtTime(.001,t+length);
  let voice;
  if(shape==='noise'){
   voice=audio.createBufferSource();voice.buffer=noise;
   const filter=audio.createBiquadFilter();filter.type='lowpass';
   filter.frequency.setValueAtTime(from,t);filter.frequency.exponentialRampToValueAtTime(to,t+length);
   voice.connect(filter);filter.connect(gain);voice.onended=()=>{filter.disconnect();gain.disconnect()};
  }else{
   voice=audio.createOscillator();voice.type=shape;voice.connect(gain);
   voice.frequency.setValueAtTime(from,t);voice.frequency.exponentialRampToValueAtTime(to,t+length);
   voice.onended=()=>gain.disconnect();
  }
  voice.start(t);voice.stop(t+length);
 }
}
function toggleAudio(){
 muted=!muted;

}

function spawn(){

 const equip=waveCount===0||Math.random()<.5?Math.floor(Math.random()*count):-1;

 g.scale(face,1);
 if(flyer){
  const flap=Math.sin(now*18)>0?-5:3;
  for(const side of [-1,1]){
   rect(side*12-6,-17+flap,12,7,'#231c34');
   rect(side*13-5,-16+flap,10,4,'#bfa4f2');
   rect(side*17-4,-14+flap,8,3,'#594578');
  }
 }else{
  const stride=m.pause>0||m.v>0?0:Math.round(Math.sin(now*(large?13:19)+m.x*.06)*2);
  rect(-8+stride,-5,6,5,'#231c34');
  rect(3-stride,-5,6,5,'#231c34');
  rect(-7+stride,-4,4,3,large?'#bb7a75':'#63b99a');
  rect(4-stride,-4,4,3,large?'#bb7a75':'#63b99a');
 }
 const width=sprite[0].length;
 sprite.forEach((line,row)=>{
  for(let col=0;col<line.length;col++){
   const ink=monsterInk[line[col]];
   if(ink)rect(col*2-width,-5-sprite.length*2+row*2,2,2,ink);
  }
 });
 g.restore();
}
let backdrop=null;
function paintBackdrop(){
 const sky=g.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#263958');sky.addColorStop(1,'#111728');rect(0,0,960,540,sky);
 for(let i=0;i<34;i++){circle((i*157+24)%960,(i*71+13)%380,i%5===0?2:1,'#92abc16b')}
 g.fillStyle='#1a2940';g.beginPath();g.moveTo(0,425);for(let i=0;i<=12;i++)g.lineTo(i*80,250+(i*73)%115);g.lineTo(960,540);g.lineTo(0,540);g.fill();
 for(let i=0;i<11;i++){const x=i*98-20,y=308+(i*47)%93;rect(x,y,49,540-y,'#142036');rect(x-6,y-7,61,9,'#1a2840');rect(x+19,y+20,8,20,'#a1775870')}
 rect(405,475,150,65,'#0c1221');rect(405,531,150,9,'#8b4378');
 for(const [x,y,w] of platforms){rect(x,y,w,16,'#273653');rect(x,y,w,4,'#7d9aba');rect(x,y+5,w,2,'#4d6889');for(let j=12;j<w-10;j+=32)rect(x+j,y+10,15,2,'#384d6d');}
 g.strokeStyle='#b4a2ff';g.lineWidth=2;g.beginPath();g.ellipse(480,146,25,9,0,0,Math.PI*2);g.stroke();
}
function draw(dt){
 if(!backdrop&&typeof g.drawImage==='function'){
  const layer=document.createElement('canvas');
  layer.width=canvas.width;layer.height=canvas.height;
  const cached=layer.getContext('2d');
  if(cached){
   const screen=g;g=cached;
   try{paintBackdrop();backdrop=layer;}finally{g=screen;}
  }
 }
 if(backdrop)g.drawImage(backdrop,0,0);
 else paintBackdrop();
 for(const m of mobs)if(m.wait<=0)drawMonster(displayPosition(m));
 for(const o of loot){const tint=lootColor(o),y=o.y+Math.sin(now*5)*3;circle(o.x,y,15,tint+'42');
  if(o.kind==='health'){rect(o.x-9,y-3,18,6,tint);rect(o.x-3,y-9,6,18,tint)}
  else if(o.kind==='armor'){g.fillStyle=tint;g.beginPath();g.moveTo(o.x-8,y-8);g.lineTo(o.x+8,y-8);g.lineTo(o.x+6,y+4);g.lineTo(o.x,y+10);g.lineTo(o.x-6,y+4);g.fill()}
  else drawWeapon(o.w,o.x,y)}
 for(const p of players)if(p.hp>0)drawAnimal(p.i===online?.you&&localVisual?{...p,...localVisual}:displayPosition(p));
 for(const s of shots){g.strokeStyle=s.w.tint;g.lineWidth=3;g.beginPath();g.moveTo(s.x-s.vx*.027,s.y-s.vy*.027);g.lineTo(s.x,s.y);g.stroke();}
 if(safe<540){rect(0,safe,960,540-safe,'#ed498651');rect(0,safe,960,3,'#ff688d');
  for(let x=0;x<960;x+=24){
   const crest=Math.round(Math.sin(x*.043+now*5)*3);
   rect(x,safe+crest,13,2,'#ffd0e3af');
  }}
 if(elapsed>=150&&active){g.font='bold 18px system-ui';g.textAlign='center';g.fillStyle='#ffd4b3';g.fillText(elapsed<155?'安全区即将上移':'安全区上移 · 往上层走',480,90)}
 for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=150*dt;f.t-=dt;if(f.t>0){g.globalAlpha=Math.min(1,f.t*5);circle(f.x,f.y,2,f.tint)}}g.globalAlpha=1;fx=fx.filter(f=>f.t>0);
}
const allowed=['KeyA','KeyD','KeyW','KeyJ','ArrowLeft','ArrowRight','ArrowUp','KeyL'];
addEventListener('keydown',e=>{if(exitPrompt){if(e.code==='Escape'){el('exit-cancel').click();e.preventDefault()}return}if(allowed.includes(e.code)){if(!e.repeat&&(!audio||audio.state!=='running'))unlockAudio();keys.add(e.code);sendInput();e.preventDefault()}});
addEventListener('keyup',e=>{keys.delete(e.code);sendInput()});
const touchButtons=[...document.querySelectorAll('[data-key]')];
const touchPointers=new Map(), touchTaps=new Set();
function clearTouch(){
 touchPointers.clear();touchTaps.clear();
 for(const button of touchButtons)button.classList.remove('is-pressed');
}
function setBattleLayout(show,controls=show){
 document.body?.classList.toggle('match-screen',show);
 el('touch-controls').hidden=!controls||exitPrompt;
 if(!controls)clearTouch();
}
addEventListener('blur',()=>{keys.clear();clearTouch();sendInput()});
document.addEventListener?.('visibilitychange',()=>{if(document.hidden){keys.clear();clearTouch();sendInput()}});
for(const button of touchButtons){
 const code=button.dataset.key;
 button.onpointerdown=event=>{
  if(exitPrompt||(!localTest&&online?.phase!=='playing'))return;
  event.preventDefault();unlockAudio();
  button.setPointerCapture(event.pointerId);
  touchPointers.set(event.pointerId,code);
  touchTaps.add(code);
  button.classList.add('is-pressed');sendInput();
 };
 button.onpointerup=button.onpointercancel=button.onlostpointercapture=event=>{
  touchPointers.delete(event.pointerId);
  if(![...touchPointers.values()].includes(code))button.classList.remove('is-pressed');
  sendInput();
 };
}
const onlineSupported=typeof location!=='undefined'&&/^https?:$/.test(location.protocol);
let online=null, roomBusy=false;
const simulatedPhone=typeof location!=='undefined'&&new URLSearchParams(location.search).get('phone')==='1';
document.body?.classList.toggle('touch-layout',simulatedPhone||Boolean(globalThis.matchMedia?.('(any-pointer: coarse)').matches));
el('local-test').onclick=()=>{
 unlockAudio();sound('click');
 localTest=true;start(false);
 el('mode').textContent='本地测试';
 setBattleLayout(true);
};
const roomNames=['居居侠','小狗大王'];
async function roomCall(payload){
 const response=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const data=await response.json();
 if(!response.ok){const error=new Error(data.error);error.status=response.status;throw error;}
 return data;
}
function roomMessage(text){
 panel('在线好友房',text,[['返回主界面',()=>roomHome()]]);
}
function roomHome(message=''){
 const socket=online?.socket;
 online=null;roomBusy=false;localTest=false;motion.clear();localVisual=null;
 socket?.close();
 el('latency').hidden=true;
 setBattleLayout(false);
 keys.clear();active=false;transition=null;players=[];mobs=[];loot=[];shots=[];fx=[];
 elapsed=0;safe=540;round=1;wins=[0,0];
 if(onlineSupported){
  sessionStorage.removeItem('animal-duel-room');
  history.replaceState(null,'',location.pathname+(simulatedPhone?'?phone=1':''));
 }
 hud();menu(message);
}
function joinByCode(){
 if(!onlineSupported){roomMessage('当前是本地文件预览。请通过联机服务器网址打开，再输入房间码加入。');return;}
 const input=document.createElement('input');
 input.id='room-code';
 input.placeholder='6 位房间码';
 input.maxLength=6;
 input.autocomplete='off';
 input.spellcheck=false;
 input.setAttribute('aria-label','房间码');
 const join=()=>{
  const code=input.value.trim().toUpperCase();
  if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){
   el('message').textContent='请输入有效的 6 位房间码。';input.focus();return;
  }
  enterRoom('join',code);
 };
 panel('加入好友房','输入朋友分享的房间码。',[['加入',join],['返回主界面',()=>roomHome()]]);
 el('actions').prepend(input);
 input.addEventListener('keydown',event=>{event.stopPropagation();if(event.key==='Enter')join();});
 input.focus();
}
async function enterRoom(action,code){
 if(!onlineSupported){roomMessage('当前是本地文件预览。请通过联机服务器网址打开，再创建好友房。');return;}
 if(roomBusy)return;
 roomBusy=true;roomMessage(action==='create'?'正在创建房间…':'正在加入房间…');
 try{
  const data=await roomCall({action,code});
  if(!roomBusy){await roomCall({action:'leave',code:data.code,token:data.token});return;}
  attachRoom(data);
 }catch(error){if(roomBusy)roomMessage(error.message||'房间服务器暂时无法连接。');}
 finally{roomBusy=false;}
}
function attachRoom(data){
 const connection={code:data.code,token:data.token,you:data.you,after:0,view:'',busy:false};
 online=connection;
 sessionStorage.setItem('animal-duel-room',JSON.stringify(connection));
 history.replaceState(null,'','?room='+data.code+(simulatedPhone?'&phone=1':''));
 renderRoom(data);
 connectRoom(connection);
}
function playerInput(consume=true){
 const touches=new Set([...touchPointers.values(),...touchTaps]);
 if(consume)touchTaps.clear();
 const held=(...codes)=>codes.some(code=>keys.has(code)||touches.has(code));
 return [held('KeyA','ArrowLeft'),held('KeyD','ArrowRight'),held('KeyW','ArrowUp'),held('KeyJ','KeyL')];
}
let localVisual=null,jumpPreview=false;
function predictLocal(dt){
 const p=players[online?.you];
 if(!active||!p?.hp||!online.received||exitPrompt||p.stun>0){localVisual=null;jumpPreview=false;return;}
 if(!localVisual)localVisual={x:p.x,y:p.y,v:p.v,ground:p.ground,face:p.face,walk:p.walk,lastMove:p.lastMove};
 const v=localVisual;
 const [left,right,jump]=playerInput(false);
 const dir=Number(right)-Number(left);
 if(dir){v.face=dir;v.x+=dir*216*dt;v.walk+=dt;v.lastMove=now;}
 if((jump||jumpPreview)&&v.ground){v.v=-435;v.ground=false;}
 jumpPreview=false;
 v.x=Math.max(15,p.x-48,Math.min(945,p.x+48,v.x));
 const prev=v.y;v.v+=980*dt;v.y+=v.v*dt;
 v.ground=v.v>=0&&land(v,prev);
 const follow=1-Math.exp(-dt*16);
 if(!dir)v.x+=(p.x-v.x)*follow;
 if(!jump&&v.ground&&p.ground&&Math.abs(p.y-v.y)>8)v.y+=(p.y-v.y)*follow;
 if(Math.abs(v.y-p.y)>110||v.y>530)localVisual=null;
}
function sendInput(){
 const c=online;
 if(c?.phase!=='playing'||c.socket?.readyState!==1||!c.received)return;
 const input=exitPrompt?[false,false,false,false]:playerInput();
 if(input[2])jumpPreview=true;
 const mask=input.reduce((result,value,i)=>result|(Number(value)<<i),0);
 if(mask===c.inputMask)return;
 c.inputMask=mask;
 c.socket.send(JSON.stringify({type:'input',input}));
}
function connectRoom(c){
 if(online!==c||c.phase==='finished')return;
 const url=new URL('/api/live',location.href);
 url.protocol=location.protocol==='https:'?'wss:':'ws:';
 const socket=new WebSocket(url);
 c.socket=socket;c.received=false;c.inputMask=-1;
 const expires=setTimeout(()=>socket.close(),5000);
 let heartbeat,lastReply=Date.now();
 const ping=()=>{
  if(socket.readyState!==1)return;
  if(Date.now()-lastReply>5000){socket.close();return;}
  socket.send(JSON.stringify({type:'ping',sent:performance.now()}));
 };
 socket.onopen=()=>{
  socket.send(JSON.stringify({type:'hello',code:c.code,token:c.token,after:c.after}));
  ping();heartbeat=setInterval(ping,1000);
 };
 socket.onmessage=event=>{
  if(online!==c||socket!==c.socket)return;
  const message=JSON.parse(event.data);
  lastReply=Date.now();
  if(message.type==='pong'){
   const rtt=Math.round(performance.now()-message.sent);
   el('latency').textContent=rtt+' ms';el('latency').hidden=false;
   return;
  }
  if(message.type==='state'){
   clearTimeout(expires);c.received=true;c.failedSince=0;c.retry=0;
   renderRoom(message.data);sendInput();
   if(c.phase==='finished')socket.close();
  }
 };
 socket.onclose=event=>{
  clearInterval(heartbeat);clearTimeout(expires);
  if(online!==c||socket!==c.socket||c.phase==='finished')return;
  if(event.code===1008){roomHome('房间会话已失效，请重新加入。');return;}
  c.failedSince ||= Date.now();
  el('latency').hidden=false;el('latency').textContent='重连中';
  if(Date.now()-c.failedSince>16000){roomHome('连接超时，已退出好友房。');return;}
  const delay=Math.min(2500,300*2**(c.retry||0));
  c.retry=(c.retry||0)+1;
  setTimeout(()=>connectRoom(c),delay);
 };
}
async function roomCommand(action,fields={}){
 const c=online;
 if(!c||c.busy)return;
 c.busy=true;
 try{
  const data=await roomCall({action,code:c.code,token:c.token,...fields});
  if(online!==c)return;
  if(action==='leave'){roomHome(data.result||'已离开好友房。');return;}
  renderRoom(data);
 }catch(error){
  if(action==='leave')roomHome('已离开，服务器将在断线超时后结算。');
  else el('message').textContent=error.message||'连接失败，请重试。';
 }finally{c.busy=false;}
}
const motion=new Map();
function entityKey(entity){return entity.isMob?'m'+entity.id:'p'+entity.i}
function displayPosition(entity){
 if(!online)return entity;
 const step=motion.get(entityKey(entity));
 if(!step)return entity;
 const blend=Math.max(0,Math.min(1,(now-step.start)/.043));
 return {...entity,x:step.x+(entity.x-step.x)*blend,y:step.y+(entity.y-step.y)*blend};
}
function updateMotion(previous,previousRound){
 const lastPosition=new Map(previous.map(entity=>{
  const visual=displayPosition(entity);
  return [entityKey(entity),visual];
 }));
 motion.clear();
 if(previousRound!==round)return;
 for(const entity of [...players,...mobs]){
  const key=entityKey(entity), old=lastPosition.get(key);
  if(old&&Math.hypot(entity.x-old.x,entity.y-old.y)<100)motion.set(key,{x:old.x,y:old.y,start:now});
 }
}
function renderRoom(data){
 const c=online;
 if(!c||c.phase==='finished'||(c.phase==='playing'&&data.phase==='lobby'))return;
 const wasPlaying=c.phase==='playing';
 c.phase=data.phase;
 setBattleLayout(data.phase==='playing'||(data.phase==='finished'&&wasPlaying),data.phase==='playing');
 el('version-button').hidden=true;
 el('exit-result').hidden=true;
 el('mode').textContent='好友房 '+data.code;
 el('return-home').hidden=data.phase!=='playing';
 if(data.phase==='lobby'){
  const status=data.players.map(p=>!p?'等待加入':!p.connected?'正在重连':p.ready?'已准备':'已加入 · 未准备');
  const mine=data.players[c.you].ready;
  const view=status.join('|');
  if(c.view!==view){
   c.view=view;
   const waiting=!data.players[1]?'等待好友加入':mine?'等待对方准备':'两人准备后自动开局';
   panel(waiting,'房间 '+data.code,[ [mine?'取消准备':'准备',()=>roomCommand('ready',{ready:!mine})],
    ['复制邀请链接',async()=>{
     try{await navigator.clipboard.writeText(location.href);el('title').textContent='邀请链接已复制';}
     catch{el('title').textContent='复制浏览器地址发给好友';}
    }],['离开房间',()=>roomCommand('leave')] ]);
   const cards=el('room-cards');
   cards.replaceChildren();
   status.forEach((text,i)=>{
    const card=document.createElement('div');
    card.className='room-card';
    card.setAttribute('data-ready',String(Boolean(data.players[i]?.ready&&data.players[i]?.connected)));
    const name=document.createElement('strong');
    name.textContent='P'+(i+1)+' · '+roomNames[i]+(c.you===i?'（你）':'');
    const state=document.createElement('span');
    state.textContent=text;
    card.append(name,state);cards.append(card);
   });
   cards.hidden=false;
  }
  return;
 }
 if(data.game){
  const previous=players, previousMobs=mobs, previousRound=round;
  ({players,mobs,loot,shots,elapsed,round,wins,safe,active,transition}=data.game);
  updateMotion([...previous,...previousMobs],previousRound);
  const current=players[c.you], old=previous[c.you];
  if(previousRound!==round||!current||current.stun>0||(old&&Math.hypot(current.x-old.x,current.y-old.y)>100))localVisual=null;
  for(const [i,p] of players.entries()){
   if(previous[i]&&previous[i].walk!==p.walk)p.lastMove=now;
   else p.lastMove=previous[i]?.lastMove??-1;
  }
  showPlayerMarkers(active&&elapsed<1.2);
  for(const event of data.events){
   if(event.id<=c.after)continue;
   c.after=event.id;for(const effect of event.fx)burst(...effect);
   for(const [cue,delay] of event.cues)sound(cue,delay);
  }
  hud();
 }
 if(data.phase==='finished'){
  active=false;transition=null;showPlayerMarkers(false);
  if(exitPrompt)closeExit();
  panel('对战结束',data.result,[['返回主界面',()=>roomHome()]]);
 }else if(active)el('panel').hidden=true;
 else if(data.game)panel(data.game.title,data.game.message,[]);
}
async function restoreRoom(){
 if(!onlineSupported)return;
 const code=new URLSearchParams(location.search).get('room');
 if(!code)return;
 let previous=null;
 try{previous=JSON.parse(sessionStorage.getItem('animal-duel-room'));}catch{}
 if(previous?.code===code&&previous.token){
  try{attachRoom({...await roomCall({action:'poll',code,token:previous.token}),token:previous.token});return;}
  catch{sessionStorage.removeItem('animal-duel-room');}
 }
 panel('加入好友房','房间 '+code,[['加入房间',()=>enterRoom('join',code)],['返回主界面',()=>roomHome()]]);
}

menu();hud();restoreRoom();
function frame(ms){now=ms/1000;const dt=Math.min(.033,last?(ms-last)/1000:0);last=ms;if(!exitPrompt&&!online){if(active){update(dt);if(localTest)touchTaps.clear()}else if(transition)advanceTransition(dt)}if(online)predictLocal(dt);draw(exitPrompt?0:dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
